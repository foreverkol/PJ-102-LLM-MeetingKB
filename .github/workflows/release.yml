name: Manual Release (Fallback)

# ⚠️ 推荐使用 release-please.yml 自动管理
# 此 workflow 仅作为手动发布的备用方案

on:
  workflow_dispatch:  # 仅手动触发
  push:
    tags: ['v*']
    branches-ignore:
      - main  # main 上的 tag 由 release-please 管理

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 跑测试
        run: |
          if [ -f tests/unit/smoke_test.py ]; then
            python3 tests/unit/smoke_test.py
          fi

      - name: 创建 tar.gz 包
        run: |
          VERSION=${GITHUB_REF_NAME}
          PACKAGE_NAME="pj102-${VERSION}"
          tar -czf ${PACKAGE_NAME}.tar.gz \
            --exclude=__pycache__ \
            --exclude=.git \
            --exclude=system/data/raw \
            --exclude=system/logs \
            --exclude=system/state \
            --exclude=.env \
            --exclude=.pytest_cache \
            --exclude=tests/output \
            --exclude=.archive \
            --exclude='*.pyc' \
            .

      - name: 计算 SHA256
        run: |
          VERSION=${GITHUB_REF_NAME}
          sha256sum pj102-${VERSION}.tar.gz > pj102-${VERSION}.tar.gz.sha256

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: "PJ-102-LLM-MeetingKB ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: |
            pj102-${{ github.ref_name }}.tar.gz
            pj102-${{ github.ref_name }}.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
